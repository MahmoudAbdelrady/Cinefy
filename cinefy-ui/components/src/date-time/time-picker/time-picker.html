<div class="time-picker-wrapper">
  <button
    type="button"
    ngpButton
    class="tp-trigger"
    [class.has-error]="control().touched && control().errors"
    [ngpPopoverTrigger]="timePopover"
    ngpPopoverTriggerPlacement="bottom-start"
    [ngpPopoverTriggerOffset]="6"
    [disabled]="control().disabled"
    [attr.data-empty]="displayLabel() ? null : ''"
  >
    <lucide-icon [img]="icons.ClockIcon" [size]="16"></lucide-icon>
    <span class="tp-trigger-label">{{ displayLabel() || 'Select a time' }}</span>
  </button>

  <ng-template #timePopover>
    <div ngpPopover class="tp-popover">
      <div class="tp-fields">
        <div class="tp-field">
          <button type="button" ngpButton class="tp-step" (click)="stepHour(1)">
            <lucide-icon [img]="icons.ChevronUpIcon" [size]="14"></lucide-icon>
          </button>
          <input
            type="text"
            class="tp-field-input"
            inputmode="numeric"
            maxlength="2"
            [value]="hour12().toString().padStart(2, '0')"
            (input)="onHourInput($event)"
            (blur)="onHourBlur($event)"
            (keydown.enter)="$event.target.blur()"
          />
          <button type="button" ngpButton class="tp-step" (click)="stepHour(-1)">
            <lucide-icon [img]="icons.ChevronDownIcon" [size]="14"></lucide-icon>
          </button>
        </div>

        <span class="tp-colon">:</span>

        <div class="tp-field">
          <button type="button" ngpButton class="tp-step" (click)="stepMinute(1)">
            <lucide-icon [img]="icons.ChevronUpIcon" [size]="14"></lucide-icon>
          </button>
          <input
            type="text"
            class="tp-field-input"
            inputmode="numeric"
            maxlength="2"
            [value]="parts().minute.toString().padStart(2, '0')"
            (input)="onMinuteInput($event)"
            (blur)="onMinuteBlur($event)"
            (keydown.enter)="$event.target.blur()"
          />
          <button type="button" ngpButton class="tp-step" (click)="stepMinute(-1)">
            <lucide-icon [img]="icons.ChevronDownIcon" [size]="14"></lucide-icon>
          </button>
        </div>

        <div class="tp-period">
          <button
            type="button"
            ngpButton
            class="tp-period-btn"
            [attr.data-active]="period() === 'AM' ? '' : null"
            (click)="setPeriod('AM')"
          >
            AM
          </button>
          <button
            type="button"
            ngpButton
            class="tp-period-btn"
            [attr.data-active]="period() === 'PM' ? '' : null"
            (click)="setPeriod('PM')"
          >
            PM
          </button>
        </div>
      </div>
    </div>
  </ng-template>

  @if (hint(); as hintText) {
  <p class="tp-hint">{{ hintText }}</p>
  } @if (control().touched && control().errors) {
  <field-error [control]="control()" [messages]="errorMessages()" />
  }
</div>
