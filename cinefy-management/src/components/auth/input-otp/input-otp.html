<div
  class="otp-root"
  [ngpInputOtpValue]="value()"
  [ngpInputOtpInputMode]="'numeric'"
  [ngpInputOtpPattern]="'^[0-9]*$'"
  (ngpInputOtpValueChange)="onValueChange($event)"
  ngpInputOtp
>
  <input #otpInput ngpInputOtpInput />

  <div class="otp-row" [class.otp-row--shake]="shake()">
    @for (i of slotIndices(); track i) {
      <div class="otp-cell" [class.otp-cell--error]="error()" ngpInputOtpSlot></div>
    }
  </div>
</div>
