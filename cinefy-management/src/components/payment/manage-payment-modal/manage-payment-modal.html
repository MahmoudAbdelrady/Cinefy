<app-modal
  #modal
  [modalTitle]="modalTitle()"
  [description]="modalDescription()"
  [close]="close()"
  width="1100px"
  bodyPadding="0"
>
  <stepper [steps]="steps()" [noteTip]="stepperNoteTip()" [(currentStep)]="currentStep" />
  <ng-template #paymobHelp>
    Most fields can be found in your
    <a class="help-link" href="https://accept.paymob.com/portal2/" target="_blank" rel="noreferrer">
      Paymob dashboard</a
    >. If a field is missing, ask your account manager — every Paymob account has these.
  </ng-template>
  <ng-template #identity>
    <identity-step />
  </ng-template>
  <ng-template #credentials>
    <credentials-step />
  </ng-template>
  <ng-template #integration>
    <integration-step />
  </ng-template>
  <ng-template #verify>
    <verification-step />
  </ng-template>
  <ng-template #review>
    <review-step />
  </ng-template>

  <div modal-footer class="manage-footer">
    <button
      ngpButton
      class="btn-secondary"
      [style.visibility]="currentStep() > 0 ? 'visible' : 'hidden'"
      (click)="goToPreviousStep()"
    >
      Back
    </button>
    @let isLastStep = currentStep() === steps().length - 1;
    <button ngpButton class="btn-primary" (click)="isLastStep ? saveAsDraft() : goToNextStep()">
      {{ isLastStep ? 'Save as Draft' : 'Continue' }}
    </button>
  </div>
</app-modal>
