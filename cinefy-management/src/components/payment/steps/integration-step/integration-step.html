<div class="integration-step-container">
  <div class="isc-header">
    <h3>Pick your integration</h3>
    <p>
      Paymob calls each payment channel an "integration". Each one has a numeric ID and (for cards)
      a checkout iframe.
    </p>
  </div>
  <form class="isc-form" [formGroup]="form()">
    <div class="isc-form-field">
      <input-field
        label="Integration ID"
        type="number"
        placeholder="4827193"
        hint="Numeric only — usually 6 to 8 digits. Paymob auto-generates this when an integration is created."
        [control]="form().controls.integrationId"
        [leadingIcon]="WebHookIcon"
        [monospace]="true"
        [errorMessages]="{ required: 'Integration ID is required' }"
      />
      <help-hint title="Where to find it">
        <strong>Developers → Payment Integrations</strong>. Each row shows a numeric ID. Pick the
        one matching the channel you're configuring (cards, wallets, installments…).
      </help-hint>
    </div>
    <div class="isc-divider"></div>
    <div class="isc-form-field">
      <div class="input-group">
        <label>Currency<span class="required">*</span></label>
        <custom-select
          [items]="currencyOptions"
          [value]="form().controls.currency.value"
          [displayFn]="currencyDisplayFn"
          [valueFn]="currencyValueFn"
          placeholder="Select a currency"
          [isError]="form().controls.currency.touched && form().controls.currency.invalid"
          (selectionChange)="onCurrencyChange($event)"
        />
      </div>
    </div>
  </form>
</div>
