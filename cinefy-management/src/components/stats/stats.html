<div class="statistics">
  @for (card of cards(); track card.label; let i = $index) {
    <div class="stat-card">
      <div class="sc-icon" [class]="VARIANTS[i % VARIANTS.length]">
        <lucide-icon [img]="card.icon" [size]="24"></lucide-icon>
      </div>
      <div class="sc-info">
        <h3>{{ card.value }}</h3>
        <p>{{ card.label }}</p>
      </div>
    </div>
  }
</div>
