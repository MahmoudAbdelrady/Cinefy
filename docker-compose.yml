services:
  cinefy-nginx:
    image: mahmoudabdelrady/cinefy-nginx:${CINEFY_NGINX_VERSION}
    restart: unless-stopped
    depends_on:
      cinefy-backend:
        condition: service_healthy
      cinefy-management:
        condition: service_healthy
      cinefy-client:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:80"
    volumes:
      - /srv/sites/cinefy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cinefy-backend:
    image: mahmoudabdelrady/cinefy-backend:${CINEFY_BACKEND_VERSION}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT}

      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}

      FRONTEND_MGMT_URL: ${FRONTEND_MGMT_URL}
      FRONTEND_CLIENT_URL: ${FRONTEND_CLIENT_URL}

      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}

      API_DOCS_BASE_URL: ${API_DOCS_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$SERVER_PORT/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  cinefy-management:
    image: mahmoudabdelrady/cinefy-frontend-management:${CINEFY_MANAGEMENT_VERSION}
    restart: unless-stopped
    environment:
      PORT: ${MANAGEMENT_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$PORT/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cinefy-client:
    image: mahmoudabdelrady/cinefy-frontend-client:${CINEFY_CLIENT_VERSION}
    restart: unless-stopped
    environment:
      NG_ALLOWED_HOSTS: ${FRONTEND_CLIENT_ALLOWED_HOSTS}
      PORT: ${CLIENT_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$PORT/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
