name: Nginx Build and Deploy

on:
  workflow_dispatch:

run-name: Nginx Build and Deploy — ${{ github.ref_name }}

concurrency:
  group: nginx-build-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-push:
    name: Build nginx
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/cinefy-nginx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx.Dockerfile
          tags: cinefy-nginx:scan
          load: true
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cinefy-nginx:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx.Dockerfile
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=nginx

      - name: Summarise
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## ${IMAGE}"
            echo
            echo "Scan passed. Pushed \`latest\` and \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Update image version env var
        run: |
          set -euo pipefail

          payload=$(jq -nc \
            --arg tag "$IMAGE_TAG" \
            '{data: [{key: "CINEFY_NGINX_VERSION", value: $tag}]}')

          echo "Request body: $payload"

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X PATCH "${DEPLOY_URL}/envs/bulk" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to update env vars (HTTP $status)"
            exit 1
          fi

      - name: Start nginx application
        env:
          APP_ID: ${{ vars.NGINX_APP_ID }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/applications/${APP_ID}/start?latest=true" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to start nginx application (HTTP $status)"
            exit 1
          fi
