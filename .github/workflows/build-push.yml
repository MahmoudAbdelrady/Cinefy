name: Build and Push

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Build and push backend
        type: boolean
        required: false
        default: true
      management:
        description: Build and push management
        type: boolean
        required: false
        default: true
      client:
        description: Build and push client
        type: boolean
        required: false
        default: true

run-name: Build and Push — ${{ github.ref_name }}

concurrency:
  group: build-push-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      empty: ${{ steps.select.outputs.empty }}
    steps:
      - name: Build matrix
        id: select
        env:
          BACKEND: ${{ inputs.backend }}
          MANAGEMENT: ${{ inputs.management }}
          CLIENT: ${{ inputs.client }}
        run: |
          images=()

          if [[ "$BACKEND" == "true" ]]; then
            images+=('{"name":"backend","context":"cinefy-backend","target":"run","image":"cinefy-backend"}')
          fi
          if [[ "$MANAGEMENT" == "true" ]]; then
            images+=('{"name":"management","context":"cinefy-frontend","target":"mgmt","image":"cinefy-frontend-management"}')
          fi
          if [[ "$CLIENT" == "true" ]]; then
            images+=('{"name":"client","context":"cinefy-frontend","target":"client","image":"cinefy-frontend-client"}')
          fi

          matrix="$(IFS=,; echo "[${images[*]}]")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "empty=${#images[@]}" >> "$GITHUB_OUTPUT"

          echo "Selected ${#images[@]} image(s): $matrix"

      - name: Fail if nothing selected
        if: steps.select.outputs.empty == '0'
        run: |
          echo "::error::No images selected — tick at least one of backend / management / client."
          exit 1

  build-push:
    name: Build ${{ matrix.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          tags: cinefy-${{ matrix.name }}:scan
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cinefy-${{ matrix.name }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Summarise
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## ${IMAGE}"
            echo
            echo "Scan passed. Pushed \`latest\` and \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
