<div class="fp-stage">
  <div class="fp-heading">
    <h1>{{ heading() }}</h1>
    <p>{{ subheading() }}</p>
  </div>

  <form (ngSubmit)="onSubmit()">
    <label class="fp-otp-label">Verification code</label>

    <cui-input-otp
      [control]="code"
      (completeChange)="complete.set($event)"
      (onEnter)="onSubmit()"
    />

    <p class="fp-otp-meta">
      <span>Didn't get a code?</span>
      @if (resendCountdown() > 0) {
        <span class="fp-otp-cooldown">{{ resendLabel() }}</span>
      } @else {
        <button
          type="button"
          class="fp-otp-resend"
          [disabled]="resending() || verifying()"
          (click)="onResend()"
        >
          @if (resending()) {
            <cui-loading-spinner variant="xs" />
            <span>Sending…</span>
          } @else {
            <span>Resend code</span>
          }
        </button>
      }
    </p>

    <button
      type="submit"
      class="btn-primary fp-submit"
      [disabled]="!complete() || verifying() || resending()"
    >
      @if (verifying()) {
        <cui-loading-spinner variant="xs" />
        <span>Verifying…</span>
      } @else {
        <span>Verify code</span>
        <svg class="fp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
      }
    </button>
  </form>

  @if (showBack()) {
    <button
      type="button"
      class="fp-back-link"
      [disabled]="verifying() || resending()"
      (click)="onBack()"
    >
      <svg [lucideIcon]="icons.ArrowLeftIcon" [size]="16"></svg>
      <span>Use a different email</span>
    </button>
  }
</div>
