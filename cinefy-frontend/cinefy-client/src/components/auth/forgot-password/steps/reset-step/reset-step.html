<div class="fp-stage">
  <div class="fp-heading">
    <h1>Set a new password</h1>
    <p>Choose a strong password you haven't used before.</p>
  </div>

  <form class="fp-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div class="input-group">
      <cui-input
        label="New password"
        type="password"
        placeholder="Enter your password"
        [leadingIcon]="icons.LockIcon"
        [control]="resetForm.controls.newPassword"
        [blockClipboard]="true"
        [errorMessages]="{
          required: 'Password is required',
          pattern: 'Password is too weak',
        }"
      />
      <cui-password-checklist [control]="resetForm.controls.newPassword" />
    </div>

    <cui-input
      label="Confirm new password"
      type="password"
      placeholder="Confirm your password"
      [leadingIcon]="icons.LockIcon"
      [control]="resetForm.controls.confirmPassword"
      [blockClipboard]="true"
      [errorMessages]="{
        required: 'Please confirm your password',
        mismatch: 'Passwords do not match',
      }"
    />

    <button
      type="submit"
      class="btn-primary fp-submit"
      [disabled]="resetForm.invalid || submitting()"
    >
      @if (submitting()) {
        <cui-loading-spinner variant="xs" />
      } @else {
        <span>Save new password</span>
        <svg class="fp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
      }
    </button>

    @if (codeRejected()) {
      <button type="button" class="fp-request-code" (click)="onRequestNewCode()">
        Request a new code
      </button>
    }
  </form>
</div>
