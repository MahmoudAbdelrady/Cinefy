<div class="bsum-card">
  <h3 class="bsum-heading">Booking summary</h3>

  @if (!seats().length) {
    <div class="bsum-empty">
      <svg [lucideIcon]="icons.InfoIcon" [size]="32"></svg>
      <p>Please select your seats to proceed.</p>
    </div>
  } @else {
    <ul class="bsum-seats">
      @for (seat of seats(); track seat.position) {
        <li class="bsum-seat">
          <span class="bsum-seat-label">
            <span class="bsum-seat-position">{{ seat.position }}</span>
            <span class="bsum-seat-category">({{ seatCategoryLabel[seat.category] }})</span>
          </span>
          <span class="bsum-seat-price">{{ seat.price | currency: 'USD' }}</span>
        </li>
      }
    </ul>

    <div class="bsum-total">
      <span>Total</span>
      <span class="bsum-total-value">{{ total() | currency: 'USD' }}</span>
    </div>

    <button
      type="button"
      class="bsum-proceed btn-primary"
      [disabled]="submitting()"
      (click)="proceedToPayment()"
    >
      @if (submitting()) {
        <cui-loading-spinner variant="xs" />
        <span>Processing…</span>
      } @else {
        Proceed to payment
      }
    </button>
  }
</div>
