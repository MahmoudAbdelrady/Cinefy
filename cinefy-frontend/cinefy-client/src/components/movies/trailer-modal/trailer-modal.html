<app-modal [modalTitle]="title() + ' - Trailer'" width="900px" bodyPadding="0" [close]="close()">
  <div class="trailer-frame">
    <iframe
      [src]="embedUrl()"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    ></iframe>
  </div>
</app-modal>
