<cui-dialog
  [header]="title() + ' - Trailer'"
  [style]="{ width: '900px' }"
  [contentStyle]="{ padding: '0' }"
  (closed)="closed.emit()"
>
  <div class="trailer-frame">
    <iframe
      [src]="embedUrl()"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    ></iframe>
  </div>
</cui-dialog>
