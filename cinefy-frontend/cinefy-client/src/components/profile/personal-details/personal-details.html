<section class="personal-details">
  <div class="pd-header">
    <div class="pd-heading">
      <h2>Personal details</h2>
      <p>The contact details tied to your bookings.</p>
    </div>
    @if (!isEditing() && !loading()) {
      <button type="button" class="btn-primary pd-edit" (click)="startEditing()">
        <svg [lucideIcon]="icons.EditIcon" [size]="15" [strokeWidth]="2"></svg>
        <span>Edit profile</span>
      </button>
    }
  </div>

  @if (loading()) {
    <div class="pd-loading">
      <cui-loading-spinner variant="lg" />
    </div>
  } @else if (isEditing()) {
    <form class="pd-form" [formGroup]="personalForm" (ngSubmit)="save()">
      <div class="pd-name-row">
        <cui-input
          label="First name"
          placeholder="Your first name"
          [control]="personalForm.controls.firstName"
          [leadingIcon]="icons.UserIcon"
          [errorMessages]="{
            required: 'First name is required',
            minlength: 'Must be at least 2 characters',
            maxlength: 'Must be at most 50 characters',
            pattern: 'First name may only contain letters, spaces, hyphens, and apostrophes',
          }"
        />
        <cui-input
          label="Last name"
          placeholder="Your last name"
          [control]="personalForm.controls.lastName"
          [leadingIcon]="icons.UserIcon"
          [errorMessages]="{
            required: 'Last name is required',
            minlength: 'Must be at least 2 characters',
            maxlength: 'Must be at most 50 characters',
            pattern: 'Last name may only contain letters, spaces, hyphens, and apostrophes',
          }"
        />
      </div>

      <cui-input
        label="Email"
        placeholder="Your email"
        [control]="personalForm.controls.email"
        [leadingIcon]="icons.EmailIcon"
        hint="Your email is your account identity and it can't be changed."
      />

      <cui-phone-input
        label="Phone"
        [countryControl]="personalForm.controls.phoneCountry"
        [numberControl]="personalForm.controls.phoneNumber"
      />

      <div class="pd-actions">
        <button type="button" class="btn-neutral" [disabled]="saving()" (click)="cancelEditing()">
          Cancel
        </button>
        <button
          type="submit"
          class="btn-primary"
          [disabled]="personalForm.invalid || !hasChanges() || saving()"
        >
          @if (saving()) {
            <cui-loading-spinner variant="xs" />
            <span>Saving…</span>
          } @else {
            <span>Save changes</span>
          }
        </button>
      </div>
    </form>
  } @else {
    <div class="pd-rows">
      <div class="pd-row">
        <span class="pd-row-icon">
          <svg [lucideIcon]="icons.UserIcon" [size]="20"></svg>
        </span>
        <div class="pd-row-text">
          <p class="pd-row-label">Full name</p>
          <p class="pd-row-value">{{ currentUser()?.fullName }}</p>
        </div>
      </div>

      <div class="pd-row">
        <span class="pd-row-icon">
          <svg [lucideIcon]="icons.EmailIcon" [size]="20"></svg>
        </span>
        <div class="pd-row-text">
          <p class="pd-row-label">Email</p>
          <p class="pd-row-value">{{ currentUser()?.email }}</p>
        </div>
      </div>

      <div class="pd-row">
        <span class="pd-row-icon">
          <svg [lucideIcon]="icons.PhoneIcon" [size]="20"></svg>
        </span>
        <div class="pd-row-text">
          <p class="pd-row-label">Phone</p>
          <p class="pd-row-value">{{ currentUser()?.phoneNumber | phoneFormat }}</p>
        </div>
      </div>
    </div>
  }
</section>
