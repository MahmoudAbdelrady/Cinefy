<section class="profile-password">
  <div class="pp-heading">
    <h2>Password</h2>
    <p>Choose a strong password you haven't used before.</p>
  </div>

  <form class="pp-form" [formGroup]="passwordForm" (ngSubmit)="save()">
    <input-field
      label="Current password"
      type="password"
      placeholder="Enter your current password"
      [control]="passwordForm.controls.currentPassword"
      [leadingIcon]="icons.LockIcon"
      [blockClipboard]="true"
      [errorMessages]="{ required: 'Current password is required' }"
    />

    <div class="input-group">
      <input-field
        label="New password"
        type="password"
        placeholder="Create a password"
        [control]="passwordForm.controls.newPassword"
        [leadingIcon]="icons.KeyRoundIcon"
        [blockClipboard]="true"
        [errorMessages]="{
          required: 'New password is required',
          pattern: 'Password is too weak',
        }"
      />
      <password-checklist [control]="passwordForm.controls.newPassword" />
    </div>

    <input-field
      label="Confirm new password"
      type="password"
      placeholder="Re-enter your new password"
      [control]="passwordForm.controls.confirmPassword"
      [leadingIcon]="icons.LockIcon"
      [blockClipboard]="true"
      [errorMessages]="{
        required: 'Please confirm your new password',
        mismatch: 'Passwords do not match',
      }"
    />

    <div class="pp-actions">
      <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid || saving()">
        @if (saving()) {
          <loading-spinner variant="xs" />
          <span>Updating…</span>
        } @else {
          <span>Update password</span>
        }
      </button>
    </div>
  </form>
</section>
