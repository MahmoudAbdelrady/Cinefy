<app-modal modalTitle="My Tickets" [description]="description()" width="512px" [close]="close()">
  <ul class="bookings-list">
    @for (booking of myBookings; track booking.id) {
      <li class="booking-item">
        <div class="bi-movie-poster">
          <img [src]="booking.moviePosterUrl" alt="{{ booking.movieTitle }} poster" />
        </div>
        <div class="bi-data">
          <div class="bi-info">
            <h3>{{ booking.movieTitle }}</h3>
            <div class="place-info">
              <div class="pi-item">
                <svg [lucideIcon]="icons.CalendarIcon" [size]="16"></svg>
                <span>{{ booking.bookingDate }} at {{ booking.bookingTime }}</span>
              </div>
              <div class="pi-item">
                <svg [lucideIcon]="icons.GlassesIcon" [size]="16"></svg>
                <span>{{ booking.is3D ? '3D' : '2D' }}</span>
              </div>
            </div>
            <div class="pricing-info">
              <div class="ticket-count">
                <svg [lucideIcon]="icons.TicketIcon" [size]="16"></svg>
                <span>x{{ booking.totalTickets }}</span>
              </div>
              <div class="total-price">
                <span>{{ booking.totalPrice | currency: 'USD' }}</span>
              </div>
            </div>
          </div>
          <div class="bi-actions">
            <button class="btn-primary">
              <span>Proceed</span>
              <svg [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
            </button>
          </div>
        </div>
      </li>
    } @empty {
      <empty-state
        [icon]="icons.TicketIcon"
        title="Bookings you start will wait here until you complete them."
      />
    }
  </ul>
</app-modal>
