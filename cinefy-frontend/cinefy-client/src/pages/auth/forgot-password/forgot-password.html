<div class="fp-page">
  @if (stage() !== 'request') {
    <fp-progress-dots [stage]="stage()" />
  }

  @switch (stage()) {
    @case ('request') {
      <fp-request-step (requested)="onRequested($event)" />
    }
    @case ('otp') {
      <fp-otp-step (verified)="onVerified()" (back)="onBackToRequest()" />
    }
    @case ('reset') {
      <fp-reset-step (reset)="onReset()" />
    }
    @case ('done') {
      <fp-done-step />
    }
  }
</div>
