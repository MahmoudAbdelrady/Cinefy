<div class="fp-page">
  @if (stage() !== 'request') {
    <fp-progress-dots [stage]="stage()" />
  }

  @switch (stage()) {
    @case ('request') {
      <fp-request-step (requested)="onRequested($event)" />
    }
    @case ('otp') {
      <auth-otp-step
        heading="Enter the code we sent"
        subheading="We emailed a 6-digit code to your email address."
        otpType="RESET_PASSWORD"
        [email]="email()"
        [verifyFn]="verifyOtp"
        (verified)="onVerified($event)"
        (back)="onBackToRequest()"
      />
    }
    @case ('reset') {
      <fp-reset-step [code]="code()" (reset)="onReset()" (requestNewCode)="onRequestNewCode()" />
    }
    @case ('done') {
      <fp-done-step />
    }
  }
</div>
