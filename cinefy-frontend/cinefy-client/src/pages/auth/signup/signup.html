<div class="signup-page">
  @switch (stage()) {
    @case ('form') {
      <div class="sp-heading">
        <h1>Create your account</h1>
        <p>Create an account to book tickets and manage your bookings.</p>
      </div>

      <form class="sp-form" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="sp-name-row">
          <input-field
            label="First name"
            type="text"
            placeholder="Enter your first name"
            [leadingIcon]="icons.UserIcon"
            [control]="signupForm.controls.firstName"
            [errorMessages]="{
              required: 'First name is required',
              minlength: 'First name must be at least 2 characters',
              maxlength: 'First name must not exceed 50 characters',
              pattern: 'First name may only contain letters, spaces, hyphens, and apostrophes',
            }"
          />
          <input-field
            label="Last name"
            type="text"
            placeholder="Enter your last name"
            [leadingIcon]="icons.UserIcon"
            [control]="signupForm.controls.lastName"
            [errorMessages]="{
              required: 'Last name is required',
              minlength: 'Last name must be at least 2 characters',
              maxlength: 'Last name must not exceed 50 characters',
              pattern: 'Last name may only contain letters, spaces, hyphens, and apostrophes',
            }"
          />
        </div>

        <input-field
          label="Email"
          type="text"
          placeholder="Enter your email"
          [leadingIcon]="icons.EmailIcon"
          [control]="signupForm.controls.email"
          [errorMessages]="{
            required: 'Email is required',
            pattern: 'Email must be a valid address',
          }"
        />

        <phone-input
          [countryControl]="signupForm.controls.phoneCountry"
          [numberControl]="signupForm.controls.phoneNumber"
        />

        <div class="input-group">
          <input-field
            label="Password"
            type="password"
            placeholder="At least 8 characters"
            [leadingIcon]="icons.LockIcon"
            [control]="signupForm.controls.password"
            [blockClipboard]="true"
            [errorMessages]="{
              required: 'Password is required',
              pattern: 'Password is too weak',
            }"
          />
          <password-checklist [control]="signupForm.controls.password" />
        </div>

        <input-field
          label="Confirm password"
          type="password"
          placeholder="Re-enter the new password"
          [leadingIcon]="icons.LockIcon"
          [control]="signupForm.controls.confirmPassword"
          [blockClipboard]="true"
          [errorMessages]="{
            required: 'Please confirm your password',
            mismatch: 'Passwords do not match',
          }"
        />

        <button
          type="submit"
          class="btn-primary sp-submit"
          [disabled]="signupForm.invalid || submitting()"
        >
          @if (submitting()) {
            <loading-spinner variant="xs" />
          } @else {
            <span>Create account</span>
            <svg class="sp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
          }
        </button>
      </form>

      <oauth-buttons />

      <p class="sp-footer">
        Already have an account?
        <a routerLink="../login">Sign in</a>
      </p>
    }
    @case ('verify') {
      <auth-otp-step
        heading="Verify your account"
        subheading="We emailed a 6-digit code to confirm your account. Enter it below to finish signing up."
        otpType="EMAIL_VERIFICATION"
        [showBack]="false"
        [email]="signupForm.controls.email.value"
        [verifyFn]="verifyAccount"
        (verified)="onVerified()"
      />
    }
  }
</div>
