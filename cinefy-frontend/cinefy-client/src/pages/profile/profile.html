<div class="profile-container">
  <div class="profile-tabs reveal">
    <nav class="pt-list">
      @for (tab of tabs; track tab.value) {
        <button
          class="pt-tab"
          [class.active]="activeTab() === tab.value"
          (click)="selectTab(tab.value)"
        >
          <svg [lucideIcon]="tab.icon" [size]="16"></svg>
          {{ tab.label }}
        </button>
      }
    </nav>

    <div class="pt-panels">
      <div class="pt-account" [hidden]="activeTab() !== 'account'">
        @if (hasVisited('account')) {
          <personal-details />
          <profile-password />
        }
      </div>
      <div [hidden]="activeTab() !== 'billing'">
        @if (hasVisited('billing')) {
          <profile-billing />
        }
      </div>
      <div [hidden]="activeTab() !== 'history'">
        @if (hasVisited('history')) {
          <profile-history />
        }
      </div>
    </div>
  </div>
</div>
