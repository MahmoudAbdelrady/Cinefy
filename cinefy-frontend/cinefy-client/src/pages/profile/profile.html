<div class="profile-container">
  <div class="profile-tabs reveal">
    <nav class="pt-list">
      @for (tab of tabs; track tab.value) {
        <button
          class="pt-tab"
          [class.active]="activeTab() === tab.value"
          (click)="activeTab.set(tab.value)"
        >
          <svg [lucideIcon]="tab.icon" [size]="16"></svg>
          {{ tab.label }}
        </button>
      }
    </nav>

    <div class="pt-panel">
      @switch (activeTab()) {
        @case ('account') {
          <div class="pt-account">
            <personal-details />
            <profile-password />
          </div>
        }
        @case ('billing') {
          <profile-billing />
        }
        @case ('bookings') {
          <profile-history />
        }
      }
    </div>
  </div>
</div>
