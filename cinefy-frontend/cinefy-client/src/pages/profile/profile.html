<div class="profile-container">
  <div
    class="profile-tabs reveal"
    ngpTabset
    ngpTabsetOrientation="vertical"
    ngpTabsetValue="account"
  >
    <div class="pt-list" ngpTabList>
      <button class="pt-tab" ngpTabButton ngpTabButtonValue="account">
        <svg [lucideIcon]="icons.UserIcon" [size]="16"></svg>
        Account
      </button>
      <button class="pt-tab" ngpTabButton ngpTabButtonValue="billing">
        <svg [lucideIcon]="icons.CreditCardIcon" [size]="16"></svg>
        Billing
      </button>
      <button class="pt-tab" ngpTabButton ngpTabButtonValue="history">
        <svg [lucideIcon]="icons.TicketIcon" [size]="16"></svg>
        Bookings
      </button>
    </div>

    <div class="pt-panels">
      <div class="pt-account" ngpTabPanel ngpTabPanelValue="account">
        <personal-details />
      </div>
      <div ngpTabPanel ngpTabPanelValue="billing"></div>
      <div ngpTabPanel ngpTabPanelValue="history"></div>
    </div>
  </div>
</div>
