<div class="home-container">
  <highlighted-movie />
  <div class="now-showing-movies">
    <div class="ms-header">
      <h3>Now Showing</h3>
      <a routerLink="/movies">View All</a>
    </div>
    <div class="ms-content">
      @for (movie of nowShowingMovies.slice(0, 5); track $index) {
        <a
          class="movie-card reveal"
          routerLink="/movies/{{ movie.code }}"
          [style.animation-delay.ms]="$index * 70"
        >
          <div class="mc-poster">
            <img [src]="movie.posterUrl" alt="{{ movie.title }} poster" loading="lazy" />
            <div class="mc-poster-overlay">
              <button class="mc-tickets-btn btn-primary">Get Tickets</button>
            </div>
          </div>
          <div class="mc-meta">
            <div class="mc-title">
              <h4>{{ movie.title }}</h4>
              @if (movie.is3D) {
                <span>3D</span>
              }
            </div>
            <div class="mc-subtitle">
              <p>{{ movie.genre }}</p>
            </div>
          </div>
        </a>
      } @empty {
        <empty-state
          class="ms-empty"
          [icon]="icons.ClapperboardIcon"
          title="No movies showing"
          description="Check back soon for what's playing in theaters."
        />
      }
    </div>
  </div>
  <div class="upcoming-movies">
    <div class="ms-header">
      <h3>Coming Soon</h3>
    </div>
    <div class="ms-content">
      @for (movie of upcomingMovies; track $index) {
        <a
          class="movie-card reveal"
          routerLink="/movies/{{ movie.code }}"
          [style.animation-delay.ms]="$index * 70"
        >
          <div class="mc-poster">
            <img [src]="movie.posterUrl" alt="{{ movie.title }} poster" loading="lazy" />
          </div>
          <div class="mc-meta">
            <div class="mc-title">
              <h4>{{ movie.title }}</h4>
            </div>
            <div class="mc-subtitle">
              <p>{{ movie.releaseDate | date: 'longDate' }}</p>
            </div>
          </div>
        </a>
      } @empty {
        <empty-state
          class="ms-empty"
          [icon]="icons.CalendarIcon"
          title="No upcoming movies"
          description="New releases will appear here as they're announced."
        />
      }
    </div>
  </div>
</div>
