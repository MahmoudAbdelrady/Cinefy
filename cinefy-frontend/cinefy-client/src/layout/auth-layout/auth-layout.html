<div class="auth-layout-container">
  <div class="alc-vignette"></div>
  <div class="alc-glow"></div>
  <div class="alc-grain"></div>

  <div class="auth-layout-header">
    <a class="alh-brand" routerLink="/">
      <img class="alh-brand-icon" src="app-logo.svg" alt="Cinefy" />
      <span class="alh-brand-text">Cinefy</span>
    </a>
  </div>

  <div class="auth-layout-content">
    @if (serverUnavailable()) {
      <cui-server-unavailable>
        <button type="button" class="btn-primary" (click)="retry()">Try again</button>
      </cui-server-unavailable>
    } @else {
      <div class="alc-shell">
        <router-outlet />
      </div>
    }
  </div>
</div>
