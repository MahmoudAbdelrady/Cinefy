<div ngpToast #toast="ngpToast" class="toast-inner">
  <div class="toast-icon">
    @if (context.variant === 'success') {
    <svg [lucideIcon]="icons.CircleCheckBigIcon" [size]="18" [strokeWidth]="2"></svg>
    } @else {
    <svg [lucideIcon]="icons.CircleXIcon" [size]="18" [strokeWidth]="2"></svg>
    }
  </div>
  <span class="toast-message">{{ context.message }}</span>
  <button class="toast-close" (click)="dismiss()">
    <svg [lucideIcon]="icons.XIcon" [size]="14" [strokeWidth]="2.5"></svg>
  </button>
</div>
