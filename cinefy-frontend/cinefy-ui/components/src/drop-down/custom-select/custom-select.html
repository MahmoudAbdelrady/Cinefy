@if (label(); as labelText) {
<label class="cs-label" [attr.data-required]="required() ? '' : null">{{ labelText }}</label>
}
<div
  ngpCombobox
  [ngpComboboxValue]="currentValue()"
  (ngpComboboxValueChange)="onValueChange($event)"
  [ngpComboboxMultiple]="multi()"
  [ngpComboboxDisabled]="disabled()"
  [ngpComboboxCompareWith]="compareWith()"
  (ngpComboboxOpenChange)="onOpenChange($event)"
  [ngpComboboxDropdownContainer]="container()"
  ngpComboboxDropdownPlacement="bottom-start"
>
  <button
    type="button"
    ngpComboboxButton
    class="cs-trigger"
    [class.cs-error]="isError() || !!(control()?.touched && control()?.invalid)"
    [disabled]="disabled()"
    (blur)="onTriggerBlur($event)"
  >
    @if (displayValue(); as display) { {{ display }} } @else {
    <span class="cs-placeholder">{{ placeholder() }}</span>
    } @if (clearable() && displayValue()) {
    <svg class="cs-clear" [lucideIcon]="icons.XIcon" [size]="16" [strokeWidth]="2" (click)="clear($event)"></svg>
    } @else {
    <svg class="cs-chevron" [lucideIcon]="icons.ChevronDownIcon" [size]="16" [strokeWidth]="2"></svg>
    }
  </button>

  <div *ngpComboboxPortal ngpComboboxDropdown class="cs-dropdown" [attr.data-width]="dropdownWidth()">
    @if (searchable()) {
    <input ngpComboboxInput type="text" class="cs-search" placeholder="Search…" (input)="onSearchInput($event)" />
    }
    <div class="cs-options" (mousedown)="onOptionsAreaMousedown($event)">
      @for (item of filteredItems(); track valueFn()(item)) {
      <div ngpComboboxOption class="cs-option" [class.cs-option-multi]="multi()" [ngpComboboxOptionValue]="item">
        @if (multi()) {
        <svg class="cs-option-check" [lucideIcon]="icons.CheckIcon" [size]="16" [strokeWidth]="2.5"></svg>
        }
        <span class="cs-option-label">{{ displayFn()(item) }}</span>
      </div>
      } @empty {
      <div class="cs-empty">No results</div>
      }
    </div>
  </div>
</div>

@if (hint(); as hintText) {
<p class="cs-hint">{{ hintText }}</p>
} @if (control(); as ctrl) { @if (ctrl.touched && ctrl.errors) {
<field-error [control]="ctrl" [messages]="errorMessages()" />
} }
