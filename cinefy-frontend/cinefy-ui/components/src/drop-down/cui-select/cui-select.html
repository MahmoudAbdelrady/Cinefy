<div class="cui-select-wrapper">
  @if (label(); as labelText) {
  <label class="cui-select-label" [attr.data-required]="isRequired() ? '' : null">{{ labelText }}</label>
  } @if (multi()) {
  <p-multiselect
    [formControl]="control()"
    (onClear)="onMultiClear()"
    [options]="items()"
    [optionLabel]="labelField()"
    [optionValue]="valueField()"
    [placeholder]="placeholder()"
    [showClear]="clearable()"
    [filter]="searchable()"
    [appendTo]="container()"
    [invalid]="control().touched && control().invalid"
    size="large"
  />
  } @else {
  <p-select
    [formControl]="control()"
    [options]="items()"
    [optionLabel]="labelField()"
    [optionValue]="valueField()"
    [placeholder]="placeholder()"
    [showClear]="clearable()"
    [filter]="searchable()"
    [appendTo]="container()"
    [invalid]="control().touched && control().invalid"
    size="large"
  >
    @if (selectedItemLabel(); as selectedLabel) {
    <ng-template #selectedItem let-item>{{ item[selectedLabel] }}</ng-template>
    }
  </p-select>
  } @if (hint(); as hintText) {
  <p class="cui-select-hint">{{ hintText }}</p>
  } @if (control().touched && control().errors) {
  <field-error [control]="control()" [messages]="errorMessages()" />
  }
</div>
