<div class="date-picker-wrapper">
  <button
    type="button"
    ngpButton
    class="dp-trigger"
    [class.dp-error]="control().touched && control().errors"
    [ngpPopoverTrigger]="calendarPopover"
    [ngpPopoverTriggerContainer]="container()"
    ngpPopoverTriggerPlacement="bottom-start"
    [ngpPopoverTriggerOffset]="6"
    (ngpPopoverTriggerOpenChange)="onOpenChange($event)"
    [disabled]="control().disabled"
    [attr.data-empty]="formatted() ? null : ''"
  >
    <svg [lucideIcon]="icons.CalendarIcon" [size]="16"></svg>
    <span class="dp-trigger-label"> {{ formatted() || placeholder() }} </span>
  </button>

  @if (hint(); as hintText) {
  <p class="dp-hint">{{ hintText }}</p>
  } @if (control().touched && control().errors) {
  <field-error [control]="control()" [messages]="errorMessages()" />
  }
</div>

<ng-template #calendarPopover>
  <div
    ngpPopover
    class="dp-popover"
    ngpDatePicker
    [ngpDatePickerDate]="value()"
    [ngpDatePickerFocusedDate]="focusedDate()"
    [ngpDatePickerMin]="min()"
    [ngpDatePickerMax]="max()"
    (ngpDatePickerDateChange)="onDateChange($event)"
    (ngpDatePickerFocusedDateChange)="onFocusedDateChange($event)"
  >
    <div class="dp-header">
      <button type="button" ngpButton ngpDatePickerPreviousMonth class="dp-nav-btn">
        <svg [lucideIcon]="icons.ChevronLeftIcon" [size]="16"></svg>
      </button>
      <div ngpDatePickerLabel class="dp-label">{{ monthLabel() }}</div>
      <button type="button" ngpButton ngpDatePickerNextMonth class="dp-nav-btn">
        <svg [lucideIcon]="icons.ChevronRightIcon" [size]="16"></svg>
      </button>
    </div>

    <div ngpDatePickerGrid class="dp-grid">
      <div class="dp-weekdays">
        @for (day of weekdays; track day) {
        <span class="dp-weekday">{{ day }}</span>
        }
      </div>

      <div class="dp-weeks">
        <ng-template ngpDatePickerRowRender>
          <div class="dp-week">
            <ng-template ngpDatePickerCellRender let-date>
              <div ngpDatePickerCell class="dp-cell">
                <button type="button" ngpButton ngpDatePickerDateButton class="dp-day">{{ date.getDate() }}</button>
              </div>
            </ng-template>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</ng-template>
