<div class="phone-input">
  @if (label(); as labelText) {
  <label class="pi-label" [attr.data-required]="required() ? '' : null">{{ labelText }}</label>
  }
  <div class="phone-row">
    <div class="phone-country">
      <custom-select-v2
        labelField="label"
        valueField="code"
        selectedItemLabel="shortLabel"
        placeholder="Country"
        [control]="countryControl()"
        [items]="countryOptions"
        [searchable]="true"
        [container]="container()"
      />
    </div>
    <div class="phone-national">
      <input-field
        type="number"
        [control]="numberControl()"
        [placeholder]="placeholder()"
        [leadingIcon]="icons.PhoneIcon"
        [errorMessages]="errorMessages()"
      />
    </div>
  </div>
</div>
