<div class="cui-field">
  @if (label(); as labelText) {
  <label class="cui-field-label" [attr.data-required]="required ? '' : null">{{ labelText }}</label>
  }

  <p-iconfield>
    @if (leadingIcon(); as icon) {
    <p-inputicon>
      <svg [lucideIcon]="icon" [size]="18"></svg>
    </p-inputicon>
    }

    <input
      #inputEl
      pInputText
      [formControl]="control()"
      [type]="resolvedType()"
      [placeholder]="placeholder()"
      [pSize]="size()"
      [invalid]="isInvalid()"
      [class.uppercase]="uppercase()"
      (input)="onInput($event)"
      (blur)="blurred.emit()"
      (copy)="onClipboardEvent($event)"
      (cut)="onClipboardEvent($event)"
      (paste)="onClipboardEvent($event)"
    />

    @if (isPassword()) {
    <p-inputicon>
      <button type="button" class="cui-field-action" (click)="toggleShowPassword()">
        <svg [lucideIcon]="showPassword() ? icons.EyeOffIcon : icons.EyeIcon" [size]="18"></svg>
      </button>
    </p-inputicon>
    } @else if (showClear()) {
    <p-inputicon>
      <button type="button" class="cui-field-action" (click)="clear()">
        <svg [lucideIcon]="icons.XIcon" [size]="18"></svg>
      </button>
    </p-inputicon>
    }
  </p-iconfield>

  @if (hint(); as hintText) {
  <p class="cui-field-hint">{{ hintText }}</p>
  } @if (hasErrorMessages() && isInvalid()) {
  <cui-field-error [control]="control()" [messages]="errorMessages()" />
  }
</div>
