<div class="input-field-wrapper">
  @if (label(); as labelText) {
  <label class="if-label" [attr.data-required]="required ? '' : null">{{ labelText }}</label>
  }

  <div class="if-input" [class.has-leading]="!!leadingIcon()" [class.has-trailing]="type() === 'password'">
    @if (leadingIcon(); as icon) {
    <lucide-icon class="if-leading" [img]="icon" [size]="18" />
    }
    <input
      ngpInput
      [formControl]="control()"
      [type]="resolvedType()"
      [placeholder]="placeholder()"
      [class.monospace]="monospace()"
      (copy)="onClipboardEvent($event)"
      (cut)="onClipboardEvent($event)"
      (paste)="onClipboardEvent($event)"
    />
    @if (type() === 'password') {
    <button ngpButton type="button" class="if-toggle" (click)="toggleShowPassword()">
      <lucide-icon [img]="showPassword() ? icons.EyeOffIcon : icons.EyeIcon" [size]="18" />
    </button>
    }
  </div>

  @if (hint(); as hintText) {
  <p class="if-hint">{{ hintText }}</p>
  } @if (control().touched && control().errors) {
  <field-error [control]="control()" [messages]="errorMessages()" />
  }
</div>
