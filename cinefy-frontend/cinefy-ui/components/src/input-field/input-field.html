<div class="input-field-wrapper">
  @if (label(); as labelText) {
  <label class="if-label" [attr.data-required]="required ? '' : null"
    >{{ labelText }}</label
  >
  }

  <div
    class="if-input"
    [attr.data-size]="size()"
    [class.has-leading]="!!leadingIcon()"
    [class.has-trailing]="type() === 'password'"
  >
    @if (leadingIcon(); as icon) {
    <svg class="if-leading" [lucideIcon]="icon" [size]="18"></svg>
    }
    <input
      #inputEl
      ngpInput
      [formControl]="control()"
      [type]="resolvedType()"
      [placeholder]="placeholder()"
      [class.monospace]="monospace()"
      (copy)="onClipboardEvent($event)"
      (cut)="onClipboardEvent($event)"
      (paste)="onClipboardEvent($event)"
    />
    @if (type() === 'password') {
    <button type="button" class="if-toggle" (click)="toggleShowPassword()">
      <svg
        [lucideIcon]="showPassword() ? icons.EyeOffIcon : icons.EyeIcon"
        [size]="18"
      ></svg>
    </button>
    }
  </div>

  @if (hint(); as hintText) {
  <p class="if-hint">{{ hintText }}</p>
  } @if (control().touched && control().errors) {
  <field-error [control]="control()" [messages]="errorMessages()" />
  }
</div>
