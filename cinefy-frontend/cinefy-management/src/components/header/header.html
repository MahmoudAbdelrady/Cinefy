<div class="header-container">
  <div class="header-inner">
    <div class="header-left">
      <button class="hamburger-btn" (click)="openSidebar()">
        <svg [lucideIcon]="icons.MenuIcon" [size]="22"></svg>
      </button>
    </div>
    <div class="header-right">
      @if (headerActionsTemplate()) {
        <div class="header-actions">
          <ng-container *ngTemplateOutlet="headerActionsTemplate()"></ng-container>
        </div>
        <div class="header-divider"></div>
      }
      <div class="user-info-container">
        <button [ngpMenuTrigger]="userInfoMenu" ngpButton>
          <div class="avatar-box">{{ initials() }}</div>
          <div class="info-box">
            <h5>{{ currentStaffMember()?.fullName }}</h5>
            <p>{{ positionLabel() }}</p>
          </div>
          <svg [lucideIcon]="icons.ChevronDownIcon" [size]="14"></svg>
        </button>
        <ng-template #userInfoMenu>
          <div class="user-info-menu-items" ngpMenu>
            @for (item of userInfoMenuItems; track item.label) {
              <button class="uim-item" ngpMenuItem (click)="item.action()">
                <svg [lucideIcon]="item.icon" [size]="16"></svg>
                <span>{{ item.label }}</span>
              </button>
            }
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
