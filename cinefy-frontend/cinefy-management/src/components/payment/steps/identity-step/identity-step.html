<div class="identity-step-container">
  <div class="hic-header">
    <h3>Identify this payment method</h3>
    <p>
      Give it an internal name so your team can tell it apart from other configurations. This label
      stays private.
    </p>
  </div>
  <form class="hic-form" [formGroup]="form()">
    <input-field
      label="Display Name"
      placeholder="e.g. Paymob Credit Cards"
      hint="Choose a name that tells configurations apart at a glance — gateway or type usually works well."
      [control]="form().controls.name"
      [errorMessages]="{
        required: 'Display name is required',
        maxlength: 'Display name must not exceed 50 characters',
        pattern:
          'Name may only contain letters, numbers, single spaces, and hyphens, with no leading or trailing spaces',
      }"
    />
    <div class="input-group">
      <label>Provider</label>
      <input class="provider-input" type="text" value="Paymob" disabled />
    </div>
    <custom-select
      label="Type"
      [required]="true"
      [items]="typeOptions"
      [control]="form().controls.type"
      [displayFn]="typeDisplayFn"
      [container]="container()"
      placeholder="Select a type"
      [errorMessages]="{ required: 'Type is required' }"
      (selectionChange)="onTypeChange($event)"
    />
  </form>
</div>
