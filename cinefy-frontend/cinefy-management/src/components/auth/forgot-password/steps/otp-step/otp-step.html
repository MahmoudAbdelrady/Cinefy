<div class="otp-step-container">
  <div class="fp-heading">
    <h1>Enter the code we sent</h1>
    <p>We emailed a 6-digit code to the email address for your account.</p>
  </div>

  <div class="fp-card">
    <form (ngSubmit)="onSubmit()">
      <label class="fp-otp-label">Verification code</label>

      <input-otp
        [value]="code()"
        [error]="error()"
        (valueChange)="onCodeChange($event)"
        (completeChange)="complete.set($event)"
      />

      <p class="fp-otp-meta">
        <span>Didn't get a code?</span>
        @if (resendCountdown() > 0) {
          <span class="fp-otp-cooldown">{{ resendLabel() }}</span>
        } @else {
          <button type="button" class="fp-otp-resend" [disabled]="resending()" (click)="onResend()">
            @if (resending()) {
              Sending…
            } @else {
              Resend code
            }
          </button>
        }
      </p>

      <button type="submit" class="fp-submit" [disabled]="!complete() || verifying()">
        @if (verifying()) {
          <loading-spinner variant="sm" />
          <span>Verifying…</span>
        } @else {
          <span>Verify code</span>
          <svg class="fp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
        }
      </button>
    </form>
  </div>

  <button type="button" class="fp-back-link" (click)="onBack()">
    <svg [lucideIcon]="icons.ArrowLeftIcon" [size]="14" [strokeWidth]="2"></svg>
    Use a different email
  </button>
</div>
