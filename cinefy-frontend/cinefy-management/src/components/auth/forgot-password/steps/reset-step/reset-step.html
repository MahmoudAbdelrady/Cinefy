<div class="reset-step-container">
  <div class="fp-heading">
    <h1>Set a new password</h1>
    <p>Choose a strong password you haven't used before.</p>
  </div>

  <div class="fp-card">
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="fp-form">
      <div class="input-group">
        <cui-input
          label="New password"
          type="password"
          placeholder="Enter your password"
          [leadingIcon]="icons.PasswordIcon"
          [control]="resetForm.controls.newPassword"
          [errorMessages]="{
            required: 'Password is required',
            pattern: 'Password is too weak',
          }"
          [blockClipboard]="true"
        />
        <password-checklist [control]="resetForm.controls.newPassword" />
      </div>

      <div class="input-group">
        <cui-input
          label="Confirm new password"
          type="password"
          placeholder="Confirm your password"
          [leadingIcon]="icons.PasswordIcon"
          [control]="resetForm.controls.confirmPassword"
          [errorMessages]="{
            required: 'Please confirm your password',
            mismatch: 'Passwords do not match',
          }"
          [blockClipboard]="true"
        />
      </div>

      <button type="submit" class="fp-submit" [disabled]="!canSubmit()">
        @if (submitting()) {
          <loading-spinner variant="sm" />
          <span>Saving…</span>
        } @else {
          <span>Save new password</span>
          <svg class="fp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
        }
      </button>

      @if (codeRejected()) {
        <button type="button" class="fp-request-code" (click)="onRequestNewCode()">
          Request a new code
        </button>
      }
    </form>
  </div>
</div>
