<div class="request-step-container">
  <div class="fp-heading">
    <h1>Forgot password?</h1>
    <p>Enter your email and we'll send a verification code to that address.</p>
  </div>

  <div class="fp-card">
    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="fp-form">
      <input-field
        label="Email"
        placeholder="Enter your email"
        [leadingIcon]="icons.EmailIcon"
        [control]="requestForm.controls.email"
        [errorMessages]="{
          required: 'Email is required',
          pattern: 'Email must be a valid address',
        }"
      />

      <button type="submit" class="fp-submit" [disabled]="requestForm.invalid || submitting()">
        @if (submitting()) {
          <loading-spinner variant="sm" />
          <span>Sending code…</span>
        } @else {
          <span>Send verification code</span>
          <svg class="fp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
        }
      </button>
    </form>
  </div>

  <a routerLink="/login" class="fp-back-link">
    <svg [lucideIcon]="icons.ArrowLeftIcon" [size]="14" [strokeWidth]="2"></svg>
    Back to sign in
  </a>
</div>
