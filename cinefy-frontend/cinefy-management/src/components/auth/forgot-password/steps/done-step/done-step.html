<div class="done-step-container">
  <div class="fp-done-card">
    <div class="fp-done-icon">
      <svg [lucideIcon]="icons.ShieldCheckIcon" [size]="26" [strokeWidth]="2.2"></svg>
    </div>

    <h1>Password updated</h1>
    <p>Your password has been changed successfully. You can now sign in with your new password.</p>

    <a routerLink="/login" class="fp-done-cta">
      <span>Continue to sign in</span>
      <svg class="fp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
    </a>
  </div>
</div>
