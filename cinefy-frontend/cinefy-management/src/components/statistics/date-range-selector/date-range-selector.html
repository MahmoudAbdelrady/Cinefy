<div class="range-selector">
  <span class="rs-label">Range filter</span>

  <div class="preset-pills">
    @for (option of presetOptions; track option.value) {
      <button
        type="button"
        [class.selected]="preset() === option.value"
        (click)="selectPreset(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <button
    type="button"
    class="custom-trigger"
    [class.selected]="preset() === 'custom'"
    (click)="toggleCustomRange($event)"
  >
    <svg [lucideIcon]="icons.CalendarIcon" [size]="18"></svg>
    <span>Custom range</span>
  </button>

  <p-popover (onShow)="onCustomRangeShow()">
    <form class="custom-range-popover" [formGroup]="customForm">
      <div class="crp-fields">
        <label class="crp-field">
          <span>From</span>
          <date-picker
            [control]="customForm.controls.from"
            [max]="today"
            placeholder="Start date"
          />
        </label>

        <label class="crp-field">
          <span>To</span>
          <date-picker [control]="customForm.controls.to" [max]="today" placeholder="End date" />
        </label>
      </div>

      @if (customError(); as error) {
        <p class="crp-error">{{ error }}</p>
      }

      <div class="crp-actions">
        <button type="button" class="btn-secondary" (click)="closeCustomRange()">Cancel</button>
        <button type="button" class="btn-primary" [disabled]="!canApply()" (click)="applyCustom()">
          Apply
        </button>
      </div>
    </form>
  </p-popover>
</div>
