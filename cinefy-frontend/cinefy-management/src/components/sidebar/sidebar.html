@if (sidebarService.isOpen()) {
  <div class="sidebar-backdrop" (click)="sidebarService.close()"></div>
}
<aside class="sidebar-container" [class.is-open]="sidebarService.isOpen()">
  <div class="header">
    <div class="header-left">
      <img class="site-icon" src="app-logo.svg" alt="Cinefy" />
      <div class="site-info">
        <h3>Cinefy</h3>
        <p>Management Portal</p>
      </div>
    </div>
    <button class="close-btn" (click)="sidebarService.close()">
      <svg [lucideIcon]="icons.XIcon" [size]="20"></svg>
    </button>
  </div>
  <nav class="pages">
    @for (tab of tabs(); track tab.path) {
      <a
        class="page-item"
        [routerLink]="tab.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="sidebarService.close()"
      >
        <svg [lucideIcon]="tab.icon" [size]="20"></svg>
        <span>{{ tab.label }}</span>
      </a>
    }
  </nav>
</aside>
