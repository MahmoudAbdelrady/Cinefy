<dashboard-widget
  [icon]="icons.ContactRoundIcon"
  header="On shift now"
  [subtitle]="subtitle()"
  iconColor="var(--oss-icon-color)"
  actionLabel="Manage staff"
  [actionIcon]="icons.UsersIcon"
  actionLink="/staff"
>
  @if (loading()) {
    <div class="oss-loading">
      <cui-loading-spinner variant="lg" />
    </div>
  } @else {
    <ul class="oss-positions">
      @for (entry of positionCounts(); track entry.position) {
        <li class="oss-position" [class.empty]="entry.count === 0">
          <p class="oss-position-count">{{ entry.count }}</p>
          <p class="oss-position-label">{{ entry.label }}</p>
        </li>
      }
    </ul>
  }
</dashboard-widget>
