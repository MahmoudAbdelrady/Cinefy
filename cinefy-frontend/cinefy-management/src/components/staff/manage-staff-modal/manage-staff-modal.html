<cui-dialog
  #dialog
  [header]="modalTitle()"
  [description]="modalDescription()"
  [canClose]="!saving()"
  [style]="{ width: '700px' }"
  (closed)="closed.emit()"
>
  @if (loading()) {
    <div class="manage-staff-modal-loading">
      <cui-loading-spinner variant="md" />
    </div>
  } @else if (failed()) {
    <cui-empty-state
      [icon]="icons.WarningIcon"
      header="Couldn't load staff member"
      description="Something went wrong. Please try again later."
    />
  } @else {
    <form [formGroup]="staffForm">
      <div class="input-groups">
        <div class="fields">
          <div class="input-group">
            <cui-input
              label="First name"
              placeholder="e.g. Mohamed"
              [leadingIcon]="icons.UserIcon"
              [control]="staffForm.controls.firstName"
              [errorMessages]="{
                required: 'First name is required',
                minlength: 'First name must be at least 2 characters',
                maxlength: 'First name must not exceed 50 characters',
                pattern: 'First name may only contain letters, spaces, hyphens, and apostrophes',
              }"
            />
          </div>
          <div class="input-group">
            <cui-input
              label="Last name"
              placeholder="e.g. Ahmed"
              [leadingIcon]="icons.UserIcon"
              [control]="staffForm.controls.lastName"
              [errorMessages]="{
                required: 'Last name is required',
                minlength: 'Last name must be at least 2 characters',
                maxlength: 'Last name must not exceed 50 characters',
                pattern: 'Last name may only contain letters, spaces, hyphens, and apostrophes',
              }"
            />
          </div>
        </div>
      </div>
      <div class="input-group">
        <cui-input
          label="Email"
          placeholder="e.g. mohamed.ahmed@gmail.com"
          [leadingIcon]="icons.EmailIcon"
          [control]="staffForm.controls.email"
          [errorMessages]="{
            required: 'Email is required',
            pattern: 'Email must be a valid address',
          }"
        />
      </div>
      <div class="input-group">
        <cui-phone-input
          [countryControl]="staffForm.controls.phoneCountry"
          [numberControl]="staffForm.controls.phoneNumber"
        />
      </div>
      <div class="input-group">
        <cui-input
          label="Password"
          [placeholder]="isEdit() ? '' : 'e.g. Strongpassword##123'"
          type="password"
          [hint]="isEdit() ? 'Leave empty to keep the current password' : ''"
          [leadingIcon]="icons.KeyIcon"
          [control]="staffForm.controls.password"
          [blockClipboard]="true"
          [errorMessages]="{
            required: 'Password is required',
            pattern: 'Password is too weak',
          }"
        />
        <cui-password-checklist [control]="staffForm.controls.password" />
      </div>
      <div class="input-group">
        <cui-select
          label="Position"
          labelField="label"
          valueField="value"
          placeholder="Select a position"
          [control]="staffForm.controls.position"
          [items]="staffPositionEntries()"
          [errorMessages]="{ required: 'Position is required' }"
        />
      </div>
      <div class="input-group">
        <label data-required>Employment type</label>
        <div class="radio-group">
          @for (entry of employmentTypeEntries; track entry.value) {
            <label
              class="radio-item"
              [class.selected]="staffForm.controls.employmentType.value === entry.value"
            >
              <p-radiobutton [value]="entry.value" formControlName="employmentType" />
              <span>{{ entry.label }}</span>
            </label>
          }
        </div>
      </div>
      <div class="input-groups">
        <label data-required>Working days</label>
        <div class="fields">
          <div class="input-group">
            <cui-select
              labelField="label"
              valueField="value"
              placeholder="Select start day"
              [control]="staffForm.controls.workingDayStart"
              [items]="weekDayEntries"
              [errorMessages]="{ required: 'Start day is required' }"
            />
          </div>
          <div class="input-group">
            <cui-select
              labelField="label"
              valueField="value"
              placeholder="Select end day"
              [control]="staffForm.controls.workingDayEnd"
              [items]="weekDayEntries"
              [errorMessages]="{
                required: 'End day is required',
                workingDays: workingDaysMessage(),
              }"
            />
          </div>
        </div>
      </div>
      <div class="input-groups">
        <label data-required>Working hours</label>
        <div class="fields">
          <div class="input-group">
            <cui-time-picker
              [control]="staffForm.controls.workingHourStart"
              [errorMessages]="{ required: 'Start time is required' }"
            />
          </div>
          <div class="input-group">
            <cui-time-picker
              [control]="staffForm.controls.workingHourEnd"
              [errorMessages]="{
                required: 'End time is required',
                workingHours: 'Working hours must span exactly 8 hours',
              }"
            />
          </div>
        </div>
      </div>
    </form>
  }
  @if (!loading() && !failed()) {
    <div customFooter class="manage-staff-modal-footer">
      <div class="save-btns">
        <button class="btn-neutral" [disabled]="saving()" (click)="dialog.close()">Cancel</button>
        <button
          class="btn-primary"
          (click)="saveMember()"
          [disabled]="staffForm.invalid || saving() || (isEdit() && !hasChanges())"
        >
          {{ isEdit() ? 'Save changes' : 'Add staff member' }}
        </button>
      </div>
    </div>
  }
</cui-dialog>
