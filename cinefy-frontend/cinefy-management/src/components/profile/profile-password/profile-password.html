<div class="profile-panel">
  <div class="panel-header">
    <div class="ph-title">
      <div class="ph-icon ph-icon-amber">
        <svg [lucideIcon]="icons.KeyIcon" [size]="16"></svg>
      </div>
      <div>
        <h4>Password</h4>
        <p>Choose a strong password you don't use elsewhere</p>
      </div>
    </div>
  </div>

  <form class="panel-body" [formGroup]="passwordForm" (ngSubmit)="save()">
    <input-field-v2
      [control]="passwordForm.controls.currentPassword"
      label="Current password"
      type="password"
      placeholder="Enter your current password"
      [leadingIcon]="icons.KeyIcon"
      [blockClipboard]="true"
      [errorMessages]="{ required: 'Current password is required' }"
    />
    <div class="form-fields">
      <div class="input-group">
        <input-field-v2
          [control]="passwordForm.controls.newPassword"
          label="New password"
          type="password"
          placeholder="At least 8 characters"
          [leadingIcon]="icons.KeyIcon"
          [blockClipboard]="true"
          [errorMessages]="{
            required: 'New password is required',
            pattern: 'Password is too weak',
          }"
        />
        <password-checklist [control]="passwordForm.controls.newPassword" />
      </div>
      <input-field-v2
        [control]="passwordForm.controls.confirmPassword"
        label="Confirm new password"
        type="password"
        placeholder="Re-enter the new password"
        [leadingIcon]="icons.KeyIcon"
        [blockClipboard]="true"
        [errorMessages]="{
          required: 'Please confirm your password',
          mismatch: 'Passwords do not match',
        }"
      />
    </div>

    <div class="panel-footer">
      <button
        type="submit"
        class="btn-primary panel-submit"
        [disabled]="passwordForm.invalid || saving()"
      >
        @if (saving()) {
          <loading-spinner variant="xs" />
          <span>Updating…</span>
        } @else {
          <span>Update password</span>
        }
      </button>
    </div>
  </form>
</div>
