<div class="auth-layout-container">
  <div class="alc-header">
    <a class="alch-brand" routerLink="/login">
      <img class="alch-icon" src="app-logo.svg" alt="Cinefy" />
      <div class="alch-info">
        <h3>Cinefy</h3>
        <p>Management Console</p>
      </div>
    </a>
  </div>
  <div class="alc-content">
    @if (serverUnavailable()) {
      <cui-server-unavailable>
        <button type="button" class="btn-primary" (click)="retry()">Try again</button>
      </cui-server-unavailable>
    } @else {
      <div class="alc-shell">
        <router-outlet />
      </div>
    }
  </div>
  <div class="alc-footer">
    <span>v1.0.0</span>
    <span>© Cinefy {{ currentYear }}</span>
  </div>
</div>
