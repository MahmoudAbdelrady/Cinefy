<ng-template #headerActionsTemplate>
  <div class="action-buttons-container">
    @if (canBook()) {
      <button class="btn-secondary" (click)="scanTicketVisible.set(true)">
        <svg [lucideIcon]="icons.QrCodeIcon" [size]="16" [strokeWidth]="2.5"></svg>
        <span>Scan ticket</span>
      </button>

      <button class="btn-secondary" (click)="activeBookingsVisible.set(true)">
        <svg [lucideIcon]="icons.TicketIcon" [size]="16" [strokeWidth]="2.5"></svg>
        <span>Active bookings</span>
      </button>
    }

    @if (canManage()) {
      <button class="btn-primary" (click)="scheduleMovieVisible.set(true)">
        <svg [lucideIcon]="icons.PlusIcon" [size]="16" [strokeWidth]="2.5"></svg>
        <span>Schedule movie</span>
      </button>
    }
  </div>
</ng-template>

@if (scanTicketVisible()) {
  <cui-dialog
    [header]="scanTicket.modalTitle()"
    [description]="scanTicket.modalDescription()"
    [style]="{ width: '480px' }"
    (closed)="scanTicketVisible.set(false)"
  >
    <scan-ticket-modal #scanTicket [close]="closeScanTicket" />
  </cui-dialog>
}

@if (scheduleMovieVisible()) {
  <manage-showtime-modal (closed)="scheduleMovieVisible.set(false)" />
}

@if (activeBookingsVisible()) {
  <active-bookings-list (closed)="activeBookingsVisible.set(false)" />
}

<div class="movies-container">
  @if (canManage()) {
    <movies-statistics />
  }
  <current-showtimes />
  @if (canManage()) {
    <upcoming-movies />
  }
</div>
