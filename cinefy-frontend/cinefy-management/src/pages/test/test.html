<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <!-- <section class="test-sandbox">
    <h2 class="test-sandbox-title">Booking ticket — inline (works)</h2>

    <div class="test-sandbox-body">
      <booking-ticket [ticket]="mockTicket" />
    </div>
  </section> -->

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Booking ticket — single dialog (works)</h2>

    <div class="test-sandbox-body">
      <button type="button" class="btn-primary" (click)="singleDialogVisible.set(true)">
        Open in dialog
      </button>
    </div>
  </section>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Booking ticket — nested dialog (the real case)</h2>

    <div class="test-sandbox-body">
      <button type="button" class="btn-primary" (click)="outerDialogVisible.set(true)">
        Open outer dialog
      </button>
    </div>
  </section>
</div>

@if (singleDialogVisible()) {
  <cui-dialog
    header="Book Seats"
    description="Ticket inside one portaled dialog"
    [style]="{ width: '1200px' }"
    (closed)="singleDialogVisible.set(false)"
  >
    <booking-ticket [ticket]="mockTicket" />
  </cui-dialog>
}

@if (outerDialogVisible()) {
  <cui-dialog
    header="Movie Showtimes"
    description="Outer dialog — open the inner one from here"
    [style]="{ width: '900px' }"
    (closed)="outerDialogVisible.set(false)"
  >
    <button type="button" class="btn-primary" (click)="innerDialogVisible.set(true)">
      Open Book Seats
    </button>
  </cui-dialog>
}

@if (innerDialogVisible()) {
  <cui-dialog
    header="Book Seats"
    description="Inner dialog — same nesting as movie-showtimes-modal → book-seats"
    [style]="{ width: '1200px' }"
    (closed)="innerDialogVisible.set(false)"
  >
    <booking-ticket [ticket]="mockTicket" />
  </cui-dialog>
}
