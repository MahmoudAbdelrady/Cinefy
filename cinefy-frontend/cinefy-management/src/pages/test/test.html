<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Tooltip</h2>

    <div class="test-sandbox-body">
      <div class="test-tooltip-row">
        <button class="btn-secondary" pTooltip="Tooltip on top" tooltipPosition="top">Top</button>
        <button class="btn-secondary" pTooltip="Tooltip on the right" tooltipPosition="right">
          Right
        </button>
        <button class="btn-secondary" pTooltip="Tooltip on the bottom" tooltipPosition="bottom">
          Bottom
        </button>
        <button class="btn-secondary" pTooltip="Tooltip on the left" tooltipPosition="left">
          Left
        </button>
      </div>

      <div class="test-tooltip-row">
        <button class="btn-secondary" pTooltip="Waits 500ms before showing" [showDelay]="500">
          Show delay
        </button>
        <button class="btn-secondary" pTooltip="Shown on click" tooltipEvent="focus">
          Focus trigger
        </button>
        <button class="btn-secondary" pTooltip="You will never see this" [tooltipDisabled]="true">
          Disabled
        </button>
      </div>
    </div>
  </section>
</div>
