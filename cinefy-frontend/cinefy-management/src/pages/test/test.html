<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Sandbox</h2>

    <div class="test-sandbox-body">
      <div class="test-field">
        <cui-switch-v2 [control]="notifications" />
        <span class="test-field-value">md / accent — {{ notifications.value }}</span>
      </div>

      <div class="test-field">
        <cui-switch-v2 size="sm" [control]="compact" />
        <span class="test-field-value">sm / accent — {{ compact.value }}</span>
      </div>

      <div class="test-field">
        <cui-switch-v2 color="highlight" [control]="highlight" />
        <span class="test-field-value">md / highlight — {{ highlight.value }}</span>
      </div>

      <div class="test-field">
        <cui-switch-v2 [control]="locked" />
        <span class="test-field-value">disabled via control</span>
      </div>
    </div>
  </section>
</div>
