<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Sandbox</h2>

    <div class="test-sandbox-body">
      <button type="button" pButton (click)="visible.set(true)">Open Dialog</button>

      @if (visible()) {
        <p-dialog
          [(visible)]="visible"
          [modal]="true"
          [dismissableMask]="true"
          header="Small Dialog"
          [style]="{ width: '24rem', height: '10rem' }"
        >
          <div class="test-field">
            <label for="hall">Hall</label>
            <p-select
              inputId="hall"
              appendTo="body"
              [options]="halls"
              [(ngModel)]="selectedHall"
              optionLabel="name"
              optionValue="id"
              placeholder="Select a hall"
            />
          </div>
        </p-dialog>
      }
    </div>
  </section>
</div>
