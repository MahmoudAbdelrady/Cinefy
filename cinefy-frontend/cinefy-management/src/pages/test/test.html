<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Sandbox</h2>

    <div class="test-sandbox-body">
      <input-field-v2
        label="Full name"
        placeholder="Jane Doe"
        hint="Plain text field with a hint."
        [control]="name"
      />

      <input-field-v2
        label="Search"
        placeholder="Search movies"
        [control]="search"
        [leadingIcon]="icons.SearchIcon"
        [clearable]="true"
      />

      <input-field-v2
        label="Email"
        placeholder="jane@example.com"
        [control]="email"
        [errorMessages]="{ required: 'Email is required', email: 'Enter a valid email' }"
      />

      <input-field-v2
        label="Password"
        type="password"
        placeholder="Password"
        [control]="password"
        [errorMessages]="{
          required: 'Password is required',
          pattern: 'Must be 8+ chars with upper, lower, number and symbol',
        }"
      />

      <input-field-v2
        label="Booking reference"
        placeholder="ABC-123"
        size="small"
        [control]="reference"
        [uppercase]="true"
        [blockClipboard]="true"
      />
    </div>
  </section>
</div>
