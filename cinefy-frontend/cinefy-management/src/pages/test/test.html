<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Paginator</h2>

    <div class="test-sandbox-body">
      <div class="test-paginator">
        <p-paginator
          [first]="currentPage()"
          [rows]="pageSize"
          [totalRecords]="totalRecords"
          [showCurrentPageReport]="true"
          [showPageLinks]="true"
          [showJumpToPageDropdown]="false"
          [showJumpToPageInput]="false"
          currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
          (onPageChange)="onPageChange($event.first ?? 0)"
        />

        <div class="test-jump-to-page">
          <span class="test-jump-to-page-label">Go to page</span>

          <cui-select
            labelField="label"
            valueField="value"
            placeholder="Select a page"
            [clearable]="true"
            [control]="jumpToPageControl"
            [items]="pageOptions()"
          />
        </div>
      </div>
    </div>
  </section>
</div>
