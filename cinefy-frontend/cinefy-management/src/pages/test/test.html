<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Sandbox</h2>

    <div class="test-sandbox-body">
      <div class="test-field">
        <input-otp [control]="code" />
        <span class="test-field-value">default length 6 — {{ code.value || '—' }}</span>
      </div>

      <div class="test-field">
        <input-otp [control]="pin" [length]="4" />
        <span class="test-field-value">length 4 — {{ pin.value || '—' }}</span>
      </div>

      <div class="test-field">
        <input-otp
          [control]="required"
          [errorMessages]="{ required: 'Enter the code', minlength: 'Code must be 6 digits' }"
        />
        <button type="button" class="btn-secondary" (click)="required.markAsTouched()">
          Touch to show error
        </button>
      </div>
    </div>
  </section>
</div>
