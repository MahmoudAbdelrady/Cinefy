<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Sandbox</h2>

    <div class="test-sandbox-body">
      <button type="button" pButton (click)="visible = true">Edit Profile</button>

      @if (visible) {
        <p-dialog
          [(visible)]="visible"
          [modal]="true"
          [dismissableMask]="true"
          header="Edit Profile"
          [style]="{ width: '24rem' }"
        >
          <div class="test-form">
            <div class="test-field">
              <label for="name">Name</label>
              <input pInputText id="name" [(ngModel)]="name" />
            </div>
            <div class="test-field">
              <label for="email">Email</label>
              <input pInputText id="email" [(ngModel)]="email" />
            </div>
          </div>

          <ng-template #footer>
            <button
              type="button"
              pButton
              severity="secondary"
              variant="outlined"
              (click)="visible = false"
            >
              Cancel
            </button>
            <button type="button" pButton (click)="visible = false">Save</button>
          </ng-template>
        </p-dialog>
      }
    </div>
  </section>
</div>
