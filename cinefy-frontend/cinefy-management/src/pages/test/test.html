<div class="test-container">
  <header class="test-header">
    <h1 class="test-title">Component Playground</h1>
    <p class="test-subtitle">
      Scratch page for trying PrimeNG components before using them in real pages.
    </p>
  </header>

  <section class="test-sandbox">
    <h2 class="test-sandbox-title">Sandbox</h2>

    <div class="test-sandbox-body">
      <button type="button" pButton (click)="togglePopover($event)">
        <span>Pick a range</span>
      </button>

      <p-popover>
        <div class="test-popover">
          <p class="test-popover-title">Date range</p>

          <ul class="test-popover-options">
            @for (preset of presets; track preset.days) {
              <li>
                <button
                  type="button"
                  class="test-popover-option"
                  [class.test-popover-option-active]="selectedPreset() === preset.days"
                  (click)="selectPreset(preset.days)"
                >
                  {{ preset.label }}
                </button>
              </li>
            }
          </ul>
        </div>
      </p-popover>

      <p class="test-readout">Selected: {{ selectedPreset() }} days</p>
    </div>
  </section>
</div>
