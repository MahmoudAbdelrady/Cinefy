<div class="forgot-password-page">
  @if (stage() !== 'request') {
    <fp-progress-dots [stage]="stage()" />
  }

  @switch (stage()) {
    @case ('request') {
      <fp-request-step (requested)="onRequested($event)" />
    }
    @case ('otp') {
      <fp-otp-step [email]="email()" (verified)="onVerified($event)" (back)="onBackToRequest()" />
    }
    @case ('reset') {
      <fp-reset-step [code]="code()" (reset)="onReset()" (requestNewCode)="onRequestNewCode()" />
    }
    @case ('done') {
      <fp-done-step />
    }
  }
</div>
