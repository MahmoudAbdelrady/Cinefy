<div class="login-page">
  <div class="lp-heading">
    <h1>Sign in</h1>
    <p>Access the Cinefy management console.</p>
  </div>

  <div class="lp-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="lp-form">
      <cui-input
        label="Email"
        placeholder="Enter your email"
        [leadingIcon]="icons.EmailIcon"
        [control]="loginForm.controls.email"
        [errorMessages]="{
          required: 'Email is required',
          pattern: 'Email must be a valid address',
        }"
      />

      <div class="lp-password">
        <cui-input
          label="Password"
          type="password"
          placeholder="Enter your password"
          [leadingIcon]="icons.PasswordIcon"
          [control]="loginForm.controls.password"
          [errorMessages]="{
            required: 'Password is required',
          }"
        />
        <div class="lp-forgot">
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>
      </div>

      <button type="submit" class="lp-submit" [disabled]="loginForm.invalid || submitting()">
        @if (submitting()) {
          <cui-loading-spinner variant="sm" />
          <span>Signing in…</span>
        } @else {
          <span>Sign in</span>
          <svg class="lp-submit-arrow" [lucideIcon]="icons.ArrowRightIcon" [size]="16"></svg>
        }
      </button>
    </form>
  </div>
</div>
