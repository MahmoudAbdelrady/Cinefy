@if (loading()) {
  <div class="profile-loading">
    <loading-spinner variant="md" />
  </div>
} @else if (profile(); as currentProfile) {
  <div class="profile-page">
    <div class="profile-intro">
      <h2>My Profile</h2>
      <p>
        Your account details. Update your name and phone — the rest is managed by your
        administrator.
      </p>
    </div>

    <div class="profile-grid">
      <div class="profile-rail">
        <profile-identity [profile]="currentProfile" />
      </div>

      <div class="profile-panels">
        <profile-personal-details [profile]="currentProfile" (updated)="profile.set($event)" />
        @if (currentProfile.position !== 'ADMIN') {
          <profile-password />
        }
      </div>
    </div>
  </div>
}
