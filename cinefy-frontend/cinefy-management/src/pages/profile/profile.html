@if (loading()) {
  <div class="profile-loading">
    <cui-loading-spinner variant="md" />
  </div>
} @else if (failed()) {
  <cui-empty-state
    [icon]="icons.WarningIcon"
    header="Couldn't load your profile"
    description="Something went wrong. Please try again later."
  />
} @else if (profile(); as currentProfile) {
  <div class="profile-page">
    <div class="profile-intro">
      <h2>My profile</h2>
      <p>An overview of your account information.</p>
    </div>

    <div class="profile-grid">
      <div class="profile-rail">
        <profile-identity [profile]="currentProfile" />
      </div>

      <div class="profile-panels">
        <profile-personal-details [profile]="currentProfile" (updated)="profile.set($event)" />
        @if (currentProfile.position !== 'ADMIN') {
          <profile-password />
        }
      </div>
    </div>
  </div>
}
