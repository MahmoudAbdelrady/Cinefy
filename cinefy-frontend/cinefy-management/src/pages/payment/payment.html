<ng-template #headerActionsTemplate>
  <div class="action-buttons-container">
    <button [ngpDialogTrigger]="addGatewayDialog">
      <svg [lucideIcon]="icons.PlusIcon" [size]="16" [strokeWidth]="2.5"></svg>
      <span>Add Payment Gateway</span>
    </button>

    <ng-template #addGatewayDialog let-close="close">
      <manage-gateway-modal [close]="close" (gatewayCreated)="gatewayList().addGateway($event)" />
    </ng-template>
  </div>
</ng-template>

<div class="payment-container">
  <gateway-list />
</div>
