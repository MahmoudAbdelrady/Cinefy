<ng-template #headerActionsTemplate>
  <div class="action-buttons-container">
    <button class="btn-primary" (click)="addGatewayVisible.set(true)">
      <svg [lucideIcon]="icons.PlusIcon" [size]="16" [strokeWidth]="2.5"></svg>
      <span>Add Payment Gateway</span>
    </button>
  </div>
</ng-template>

@if (addGatewayVisible()) {
  <manage-gateway-modal
    (closed)="addGatewayVisible.set(false)"
    (gatewayCreated)="gatewayList().addGateway($event)"
  />
}

<div class="payment-container">
  <gateway-list />
</div>
