<ng-template #headerActionsTemplate>
  <div class="action-buttons-container">
    <button [ngpDialogTrigger]="addPaymentMethodDialog">
      <svg [lucideIcon]="icons.PlusIcon" [size]="16" [strokeWidth]="2.5"></svg>
      <span>Add Payment Method</span>
    </button>

    <ng-template #addPaymentMethodDialog let-close="close">
      <manage-payment-modal
        [close]="close"
        (paymentMethodCreated)="paymentMethodList().addPaymentMethod($event)"
      />
    </ng-template>
  </div>
</ng-template>

<div class="payment-container">
  <payment-method-list />
</div>
