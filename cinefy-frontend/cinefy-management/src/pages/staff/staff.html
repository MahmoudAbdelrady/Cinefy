<ng-template #headerActionsTemplate>
  <div class="action-buttons-container">
    <button [ngpDialogTrigger]="manageStaffDialog">
      <svg [lucideIcon]="icons.UserPlusIcon" [size]="16" [strokeWidth]="2.5"></svg>
      <span>Add Staff Member</span>
    </button>
  </div>

  <ng-template #manageStaffDialog let-close="close">
    <manage-staff-modal
      [close]="close"
      (staffMemberCreated)="staffList().onStaffMemberCreated($event)"
      (staffMemberUpdated)="staffList().onStaffMemberUpdated($event)"
    />
  </ng-template>
</ng-template>

<div class="staff-container">
  <staff-position-coverage />
  <staff-list (coverageChanged)="staffPositionCoverage().applyChange($event)" />
</div>
