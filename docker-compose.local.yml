services:
  cinefy-nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    image: mahmoudabdelrady/cinefy-nginx:${CINEFY_NGINX_VERSION}
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:4200"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cinefy-backend:
    build:
      context: ./cinefy-backend
      dockerfile: Dockerfile
    image: mahmoudabdelrady/cinefy-backend:${CINEFY_BACKEND_VERSION}
    restart: unless-stopped
    depends_on:
      cinefy-db:
        condition: service_healthy
      cinefy-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT}

      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}

      FRONTEND_MGMT_URL: ${FRONTEND_MGMT_URL}
      FRONTEND_CLIENT_URL: ${FRONTEND_CLIENT_URL}

      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}

      API_DOCS_BASE_URL: ${API_DOCS_BASE_URL:-/docs}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$SERVER_PORT/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  cinefy-management:
    build:
      context: ./cinefy-frontend
      dockerfile: Dockerfile
      target: mgmt
    image: mahmoudabdelrady/cinefy-frontend-management:${CINEFY_MANAGEMENT_VERSION}
    restart: unless-stopped
    environment:
      PORT: ${MANAGEMENT_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$PORT/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cinefy-client:
    build:
      context: ./cinefy-frontend
      dockerfile: Dockerfile
      target: client
    image: mahmoudabdelrady/cinefy-frontend-client:${CINEFY_CLIENT_VERSION}
    restart: unless-stopped
    environment:
      NG_ALLOWED_HOSTS: localhost
      PORT: ${CLIENT_PORT}
      API_ORIGIN: http://cinefy-backend:${SERVER_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$$PORT/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cinefy-db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - cinefy-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cinefy-redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    volumes:
      - cinefy-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cinefy-db-data:
  cinefy-redis-data:
